<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4">
    <div class="flex items-center justify-between gap-6">
        <a class="shrink order-1" routerLink="/shop/{{item().productId}}">
            <img class="h-20 w-20" src="{{item().pictureUrl}}" alt="product image">
        </a>
        <div class="flex items-center justify-between order-3">
            <div class="flex items-center align-middle gap-3">
                <button mat-icon-button (click)="decrementQuantity()">
                    <mat-icon>remove</mat-icon>
                </button>
                <div class="font-semibold text-xl mb-1">
                    {{item().quantity}}
                </div>
                <button mat-icon-button (click)="incremetQuantity()">
                    <mat-icon>add</mat-icon>
                </button>
            </div>
            <div class="text-end order-4 w-32">
                <p class="font-bold text-xl">
                    {{item().price | currency}}
                </p>
            </div>
        </div>
        <div class="w-full flex flex-col space-y-4 order-2 max-w-md">
            <a class="font-medium" routerLink="/shop/{{item().productId}}">
                {{item().productName}}
            </a>
            <div class="flex items-center gap-4">
                <button mat-button (click)="removeItemFromCart()">
                    <mat-icon>delete</mat-icon>
                    Delete
                </button>
            </div>
        </div>
    </div>

</div>
